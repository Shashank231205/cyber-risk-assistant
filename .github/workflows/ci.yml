name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  quality:
    name: Lint, types and security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests scripts main.py

      - name: Type check
        run: mypy src scripts main.py

      - name: Security lint
        run: bandit -q -c pyproject.toml -r src scripts

      - name: Audit dependencies
        run: pip-audit --strict

      - name: Requirement files are current
        run: python scripts/sync_requirements.py --check

      # A committed credential is unrecoverable, so this is a hard gate
      # rather than an advisory check.
      - name: No environment file is tracked
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example'; then
            echo "::error::an environment file is tracked"
            exit 1
          fi
          echo "no environment files tracked"

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Cache the embedding model
        uses: actions/cache@v6
        with:
          path: ~/.cache/fastembed
          key: fastembed-${{ runner.os }}-bge-small-en-v1.5

      - name: Build the retrieval index
        run: |
          python scripts/fetch_reference_data.py --verify
          python scripts/build_index.py
          python scripts/build_index.py --verify

      # No API keys are configured, so narration takes the deterministic path
      # and the suite makes no calls to a language provider.
      - name: Test
        run: pytest

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          retention-days: 7

  container:
    name: Container image
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: cyber-risk-assistant:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Starting the container proves the baked index and snapshots are
      # present and usable, which a successful build alone does not.
      - name: Start and verify
        run: |
          docker run -d --name api -p 8000:8000 cyber-risk-assistant:ci
          for attempt in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null; then
              echo "service is up"
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "::error::service did not become healthy"
              docker logs api
              exit 1
            fi
            sleep 2
          done

          curl -sf http://127.0.0.1:8000/ready | tee ready.json
          grep -q '"status":"ready"' ready.json

          curl -sf http://127.0.0.1:8000/report -o report.json
          python - <<'VERIFY'
          import json

          report = json.load(open("report.json", encoding="utf-8"))
          assert len(report["risks"]) == 5, f"expected 5 risks, got {len(report['risks'])}"

          top = report["risks"][0]
          assert top["control"], "no control was retrieved for the top risk"
          assert top["narrative"], "no narrative was produced"
          assert report["provenance"]["controls_indexed"] > 1000, "index looks incomplete"
          print("container serves a complete report")
          VERIFY

      - name: Container logs
        if: always()
        run: docker logs api || true

      - name: Stop
        if: always()
        run: docker rm -f api || true
