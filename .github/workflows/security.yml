name: Security

on:
  schedule:
    # Weekly, so a newly disclosed advisory is caught without waiting for a
    # push to a project that may be idle.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Audit
        run: |
          pip-audit --strict -r requirements.txt
          pip-audit --strict -r requirements-dev.txt

      - name: Security lint
        run: bandit -q -c pyproject.toml -r src scripts
